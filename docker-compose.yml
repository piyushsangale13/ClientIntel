version: "3.9"

services:
  backend2:
    build:
      context: ./backend2
    container_name: clientintel-backend2
    env_file:
      - ./backend2/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    # restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: clientintel-postgres
    environment:
      POSTGRES_DB: clientintel
      POSTGRES_USER: clientintel
      POSTGRES_PASSWORD: clientintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientintel -d clientintel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clientintel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
